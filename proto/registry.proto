syntax = "proto3";

package registry;

message NodeInfo {
    string node_id = 1;
    string node_type = 2;
    string address = 3;
}

message RegisterNodeRequest {
    NodeInfo node = 1;
}

message RegisterNodeResponse {
    bool success = 1;
    string message = 2;
}

message UnregisterNodeRequest {
    string node_id = 1;
}

message UnregisterNodeResponse {
    bool success = 1;
    string message = 2;
}

message GetNodesRequest {
}

message GetNodesResponse {
    repeated NodeInfo nodes = 1;
}

service NodeRegistryService {

    rpc RegisterNode(RegisterNodeRequest)
        returns (RegisterNodeResponse);

    rpc UnregisterNode(UnregisterNodeRequest)
        returns (UnregisterNodeResponse);

    rpc GetNodes(GetNodesRequest)
        returns (GetNodesResponse);
}